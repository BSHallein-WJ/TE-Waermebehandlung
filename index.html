<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TE-Wärmebehandlung</title>
    <link rel="icon" type="image/png" href="App-Logo.png">
    <link rel="apple-touch-icon" href="App-Logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0b57a4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Drehen, Fräsen, Schleifen">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="app-container">
        <div class="header">
            <div class="header-title-container">
                <a class="btn-zentrale" id="zentrale-button"
                    href="https://bshallein-wj.github.io/Zentral-Portal/index.html">Zentrale</a>
                <h1 id="category-title" style="display: none;"></h1>
                <div class="progress-wrapper" id="progress-wrapper" style="display: none;">
                    <div class="progress" id="progress">Frage 1 von 1</div>
                    <div class="progress-bar" aria-hidden="true">
                        <div class="progress-bar-fill" id="progress-bar-fill"></div>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-order-toggle" id="order-toggle-button" onclick="toggleQuestionOrder()"
                    title="Reihenfolge wechseln" aria-label="Reihenfolge wechseln">Modus: Sortiert</button>
                <button class="btn-burger" onclick="toggleMenu()" title="Menü öffnen"
                    aria-label="Menü öffnen">&#9776;</button>
            </div>
        </div>

        <!-- Menü mit Navigation und Rechtshinweisen -->
        <div class="menu-dropdown" id="menu-dropdown">
            <button type="button" onclick="goToStart()">Startseite</button>
            <button type="button" onclick="toggleDarkMode()" id="dark-mode-button">Darkmode</button>
            <label class="menu-switch">
                <span>Antworten immer anzeigen</span>
                <input type="checkbox" id="always-show-answers-toggle" onchange="setAlwaysShowAnswers(this.checked)"
                    aria-label="Antworten immer anzeigen">
                <span class="switch-slider" aria-hidden="true"></span>
            </label>
            <button type="button" onclick="setQuestionOrder('mixed')">Fragen gemischt stellen</button>
            <button type="button" onclick="setQuestionOrder('sequential')">Fragen der Reihe nach</button>
            <button type="button" onclick="closeApp()">App schließen</button>
        </div>

        <div class="content-area">
            <div class="start-screen" id="start-screen">
                <img src="Titelbild.png" alt="Drehen, Fräsen und Schleifen" class="start-image">
                <div class="category-buttons" id="category-buttons"></div>
                <div class="legal-links">
                    <a href="https://bshallein-wj.github.io/Zentral-Portal/impressum.html" target="_blank"
                        rel="noopener noreferrer">Impressum</a>
                    <a href="https://bshallein-wj.github.io/Zentral-Portal/datenschutz.html" target="_blank"
                        rel="noopener noreferrer">Datenschutz</a>
                </div>
            </div>

            <div id="quiz-screen" style="display: none;">
                <div class="question-box" id="question">
                    <span class="level-indicator" id="level-indicator" aria-label="Wissensniveau"></span>
                    <span id="question-text">Lade Frage...</span>
                </div>
                <div id="question-images"></div>
                <div class="solution-box" id="solution-box">
                    <div class="solution-title"><span class="solution-icon" aria-hidden="true">&#10003;</span>Lösung &
                        Erklärung</div>
                    <div class="solution-answer" id="solution-answer"></div>
                    <div id="solution-images"></div>
                </div>
            </div>
        </div>

        <div class="footer-buttons" id="footer-buttons" style="display: none;">
            <button class="btn-home" onclick="goToStart()">Home</button>
            <button class="btn-prev" id="btn-prev" onclick="prevQuestion()">Zurück</button>
            <button class="btn-solve" onclick="toggleSolution()">Lösung</button>
            <button class="btn-next" id="btn-next" onclick="nextQuestion()">Weiter</button>
        </div>

    </div>

    <div class="image-viewer" id="image-viewer" aria-hidden="true">
        <img id="viewer-image" src="" alt="">
    </div>

    <script src="fragen.js"></script>
    <script src="app.js"></script>

</body>

</html>
